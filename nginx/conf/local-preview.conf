worker_processes 1;
events { worker_connections 1024; }
http {
 include mime.types;
 default_type application/octet-stream;
 sendfile on;
 server {
  listen 127.0.0.1:8080;
  server_name localhost;
  root "C:/Users/LCJNZX8/Desktop/SimCare-Windows-Deployment (1)/frontend";
  client_max_body_size 12m;
  location = / { return 302 /portal.html; }
  location ~ ^/(?:en/)?training/[^/]+/$ { try_files /training.html =404; add_header Cache-Control no-store; }
  location /ui/ { try_files $uri =404; add_header Cache-Control no-store; }
  location = /admin/models { try_files /models.html =404; }
  location = /admin/bailian { try_files /bailian.html =404; }
  location / { try_files $uri @api; add_header Cache-Control no-store; }
  location @api {
   proxy_pass http://127.0.0.1:28876;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_buffering off;
   proxy_read_timeout 150s;
  }
 }
}
