<!doctype html><html><meta charset="utf-8"><title>SimCare</title><body><p id="status">正在载入训练 / Loading training…</p><script>
(async()=>{try{const path=location.pathname.replace(/\/$/,'');const r=await fetch(path+'/api/bootstrap',{cache:'no-store'});if(!r.ok)throw Error(r.status===401?'请先登录 / Please sign in':'无法打开此训练 / Training unavailable');const boot=await r.json();if(path!==boot.base){location.replace(boot.base+'/');return;}window.simcareBoot=boot;window.trainingBase=boot.base;const html=await fetch('/ui/'+boot.variant+'/index.html',{cache:'no-store'});if(!html.ok)throw Error('Training interface unavailable');const page=(await html.text()).replace(/src="\/ui\/[^"/]+\/app\.js\?[^" ]*"/, 'src="'+boot.base+'/app.js?v=speech-3"');document.open();document.write(page);document.close();}catch(e){document.getElementById('status').textContent=e.message;}})();
</script></body></html>
